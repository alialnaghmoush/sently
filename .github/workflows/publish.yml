# CI and publish for sently: verify in parallel, then publish npm and JSR in parallel.
#
# Setup:
# - JSR: Link this repo to the package in JSR settings (https://jsr.io/@omqkhafi/sently).
# - npm Trusted Publishing (preferred): on https://www.npmjs.com/package/sently → Settings →
#   Trusted Publisher → GitHub Actions:
#     repository: omqkhafi/sently
#     workflow: publish.yml
#     environment: production
# - npm token fallback (temporary): repo secret NPM_TOKEN — used only if OIDC publish fails.
#   Remove NPM_TOKEN after one successful OIDC publish is verified.
#
# On push of a version tag (v*): run Verify in parallel, then publish npm and JSR
# in parallel. npm always uses `npm publish --provenance` (see scripts/publish.ts).

name: CI and Publish

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify (${{ matrix.check }})
    runs-on: ubuntu-latest
    environment: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Typecheck
            run: bun run typecheck
          - check: Lint
            run: bun run lint
          - check: Build
            run: bun run build
          - check: Test
            # api-surface / v0.8 suites import dist — build first (matrix jobs do not share artifacts)
            run: bun run build && bun test
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: ${{ matrix.check }}
        run: ${{ matrix.run }}

  publish-npm:
    name: Publish npm
    runs-on: ubuntu-latest
    needs: verify

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Require npm CLI for Trusted Publishing
        run: |
          npm --version
          node -e "
            const [maj, min, pat] = require('child_process')
              .execSync('npm --version', { encoding: 'utf8' })
              .trim()
              .split('.')
              .map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) {
              console.error('npm >= 11.5.1 required for Trusted Publishing, got', process.version);
              process.exit(1);
            }
          "
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Publish to npm (OIDC first, token fallback)
        env:
          # Fallback only — script strips this for the OIDC attempt. Remove after OIDC succeeds once.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run scripts/publish.ts -- --npm-only --force

  publish-jsr:
    name: Publish JSR
    runs-on: ubuntu-latest
    needs: verify

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Publish to JSR
        run: bun run scripts/publish.ts -- --jsr-only --force
